name: Release

# A tag v* runs CI, then builds the daemon and the APKs on two runners, in different
# directories, checks that both builds are byte for byte the same, and publishes the APKs as a
# GitHub release. A pull request that changes the release build, or a run by hand from the
# Actions tab, does all of this except publishing, signing with a throwaway key.
#
# The APKs are signed with the keystore in the ANDROID_KEYSTORE secret (base64 of a .jks holding
# one key, whose password is the store's) and its password in ANDROID_KEYSTORE_PASSWORD.
# Releases keep one key, so that each APK installs over the last; a tag without these secrets
# fails.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile
      - mk_*
      - dependencies.txt
  workflow_dispatch:

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'test' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        dir: [a, b/elsewhere]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ matrix.dir }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
            echo "::add-mask::$PASSWORD"
            echo "KEYSTORE_PASSWORD=$PASSWORD" >> $GITHUB_ENV
          elif [ "$VERSION" != test ]; then
            echo "::error::a release needs the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets"
            exit 1
          else
            keytool -genkeypair -keystore $RUNNER_TEMP/release.jks -storepass throwaway -keypass throwaway \
              -alias kpclientd -keyalg RSA -keysize 2048 -validity 1 -dname CN=kpclientd-test
            echo "KEYSTORE_PASSWORD=throwaway" >> $GITHUB_ENV
          fi
          echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - run: make -C ${{ matrix.dir }} sdk release
      - uses: actions/upload-artifact@v5
        with:
          name: build-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/dist/*.apk

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: build-*
      - name: Both builds are the same
        run: |
          sha256sum */*
          for apk in build-0/*-unsigned.apk; do
            cmp $apk build-1/${apk#*/}
          done
          # Two throwaway keys sign differently; the release key signs the same both times.
          [ "$VERSION" = test ] || diff -r build-0 build-1
          mkdir release && cp build-0/* release/
          cd release && sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            SHA256SUMS
          generate_release_notes: true
