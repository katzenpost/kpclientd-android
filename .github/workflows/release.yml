name: Release

# A tag v* runs CI, then builds the arm64 daemon and APK twice each and checks that both builds
# are byte for byte the same, signs the APK, and publishes it as a GitHub release.
#
# The APK is signed with the keystore in the ANDROID_KEYSTORE secret (base64 of a .jks holding
# one key, whose password is the store's) and its password in ANDROID_KEYSTORE_PASSWORD. Releases
# keep one key, so that each APK installs over the last.

on:
  push:
    tags: ["v*"]

env:
  NDK: "28.0.13004108"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          echo "GO=$(sed -n 's/^go=go//p' dependencies.txt)" >> "$GITHUB_ENV"
          echo "KATZENPOST=$(sed -n 's/^katzenpost=//p' dependencies.txt)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO }}
          cache: false
      - uses: actions/checkout@v5
        with:
          repository: katzenpost/katzenpost
          ref: ${{ env.KATZENPOST }}
          path: katzenpost
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK" "platforms;android-36" "build-tools;36.0.0"
      - name: Daemon, twice
        run: |
          export KATZENPOST_REPO=$PWD/katzenpost ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK
          ./verify_daemon_reproducible
          ./mk_daemon arm64
      - name: Unsigned APK, twice
        run: ./verify_apk_reproducible
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::a release needs the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          tools=$ANDROID_HOME/build-tools/36.0.0
          ./mk_apk
          mkdir -p dist
          unsigned=dist/kpclientd-android-$GITHUB_REF_NAME-arm64-v8a-unsigned.apk
          signed=dist/kpclientd-android-$GITHUB_REF_NAME-arm64-v8a.apk
          cp apk/deploy/kpclientd-release-unsigned.apk "$unsigned"
          "$tools/zipalign" -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          KS_PASS=$PASSWORD "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KS_PASS --out "$signed" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$signed" | tee "$RUNNER_TEMP/cert.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
