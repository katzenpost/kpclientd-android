name: CI

# Unit tests; the daemon and the APKs built from the pinned Go, Katzenpost and Android tools; and,
# on an emulator, the check that no app reaches the daemon without the user's answer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: make test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('dependencies.txt') }}
      - run: make sdk apk
      - uses: actions/upload-artifact@v5
        with:
          name: apks
          path: apk/app/build/outputs/apk/**/*.apk

  approval:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apks
          path: apks
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: make test-approval APK=apks/debug/app-x86_64-debug.apk
