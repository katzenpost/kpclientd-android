name: CI

# Unit tests; the daemon and the APKs built from the pinned Go, Katzenpost and Android tools; and,
# on an emulator, the check that no app reaches the daemon without the user's answer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  NDK: "28.0.13004108"

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: cd apk && ./gradlew --no-daemon testDebugUnitTest

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          echo "GO=$(sed -n 's/^go=go//p' dependencies.txt)" >> "$GITHUB_ENV"
          echo "KATZENPOST=$(sed -n 's/^katzenpost=//p' dependencies.txt)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO }}
          cache: false
      - uses: actions/checkout@v5
        with:
          repository: katzenpost/katzenpost
          ref: ${{ env.KATZENPOST }}
          path: katzenpost
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK" "platforms;android-36" "build-tools;36.0.0"
      - name: Daemon
        run: |
          export KATZENPOST_REPO=$PWD/katzenpost ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK
          ./mk_daemon arm64
          ./mk_daemon amd64
      - run: cd apk && ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: apks
          path: apk/app/build/outputs/apk/**/*.apk

  approval:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apks
          path: apks
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./test_approval apks/debug/app-x86_64-debug.apk
